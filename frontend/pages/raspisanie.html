<section class="schedule-page">
    <h2>Расписание занятий</h2>

    <div class="public-card">
        <h3>Выбор группы</h3>
        <form id="schedule-form">
            <div class="form-group">
                <label for="schedule-group">Группа</label>
                <select id="schedule-group" required>
                    <option value="" disabled selected>Выбор группы</option>
                    <option value="ИС-20">ИС-20</option>
                    <option value="ИС-19">ИС-19</option>
                </select>
            </div>
            <button type="submit">Показать</button>
        </form>
    </div>
    <hr style="margin: 25px 0;">
    <h3>Расписание на неделю</h3>

    <div class="schedule-wrapper">
        <table class="schedule-table">
            <thead>
                <tr>
                    <th class="time-col"> Время</th>
                    <th>Понедельник</th>
                    <th>Вторник</th>
                    <th>Среда</th>
                    <th>Четверг</th>
                    <th>Пятница</th>
                    <th>Суббота</th>
                    <th>Воскресенье</th>
                </tr>
            </thead>
            
            <tbody>
                <tr>
                    <td class="time-col">08:30-10:00</td>
                </tr>
                <tr>
                    <td class="time-col">10:10-11:40</td>
                </tr>
                <tr>
                    <td class="time-col">12:00-13:30</td>
                </tr>
                <tr>
                    <td class="time-col">14:30-16:00</td>
                </tr>
                <tr>
                    <td class="time-col">16:10-17:40</td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
