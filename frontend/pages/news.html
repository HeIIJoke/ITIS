<section class="news-page">
  <div class="news-wrapper">

    <div class="news-header">
      <h1>Новости</h1>
      <button id="toggle-form-btn" class="btn-add">Опубликовать новость</button>
    </div>
    
  </div>

  <div id="publish-form-card" class="publish-card hidden">

    <h3>Новая публикация</h3>
    <form id="news-form">
      <div class="form-group">

        <label for="news-title">Заголовок</label>
        <input type="text" id="news-title" required placeholder="Введите заголовок...">

      </div>

      <div class="form-group">

        <label for="news-content">Текст новости</label>
        <textarea id="news-content" rows="4" required placeholder="Введите текст новости..."></textarea>
        
      </div>

      <div class="form-group">
        <label for="news-category">Категория</label>
        <select id="news-category" required>
            <option value="" disabled selected>Выберите категорию</option>
        </select>
      </div>
    
      <div class="form-group">
        <label for="news-image-url">Ссылка на изображение</label>
        <input
            type="url"
            id="news-image-url"
            placeholder="https://example.com/image.jpg"
        >
      </div>
    
      <div class="form-group">
        <label class="event-checkbox">
            <input type="checkbox" id="news-is-event">
            <span class="event-checkbox-mark"></span>
    
            <span class="event-checkbox-text">
                <span class="event-checkbox-title">Это событие</span>
                <span class="event-checkbox-description">
                    Отметьте, если новость посвящена мероприятию или важному событию
                </span>
            </span>
        </label>
      </div>

      <div class="form-action">
        <button type="submit" class="btn-submit">Опубликовать</button>
        <button type="button" id="cancel-form-btn" class="btn-cancel">Отмена</button>
      </div>

    </form>

  </div>

  <div id="news-list" class="news-list">
    
  </div>

</section>
