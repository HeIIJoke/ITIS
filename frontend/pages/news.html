<section class="news-page">

  <h2>Новости кафедры</h2>

  <div class="publish-card">

    <h3>Опубликовать новость</h3>

    <form id="news-form">

      <div class="form-group">

        <label for="news-title">Заголовок</label>
        <input type="text" id="news-title" required placeholder="Введите заголовок...">

      </div>

      <div class="form-group">

        <label for="news-content">Текст новости</label>
        <textarea id="news-content" rows="4" required placeholder="Введите текст новости..."></textarea>
        
      </div>

      <button type="submit">Опубликовать</button>

    </form>

  </div>

  <hr style="margin: 25px 0;">

  <h3>Последние публикации</h3>

  <div id="news-container">
    <p>Загрузка новостей...</p>
  </div>

</section>
