name: itis

services:
  db:
    image: postgres:17-alpine
    container_name: itis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itis}
      POSTGRES_USER: ${POSTGRES_USER:-itis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itis}
      # Кладём данные в подпапку, чтобы volume не конфликтовал с образом postgres.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./bd/sql_v2.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./bd/migrations/001_auth.sql:/docker-entrypoint-initdb.d/20-auth.sql:ro
    ports:
      # удобно для подключения с хоста (pgAdmin/DBeaver).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - itis

  # ---------------------------------------------------------------------------
  # FastAPI-приложение. Собирается из multi-stage Dockerfile (лёгкий runtime).
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    #image: itis-app:latest
    container_name: itis-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-itis}
      POSTGRES_USER: ${POSTGRES_USER:-itis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itis}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-itis}:${POSTGRES_PASSWORD:-itis}@db:5432/${POSTGRES_DB:-itis}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - itis

volumes:
  pgdata:

networks:
  itis:
    driver: bridge
