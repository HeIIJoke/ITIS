name: CI

# Пайплайн из трёх этапов: lint -> test -> docker.
# Каждый следующий этап запускается только если прошёл предыдущий (needs).

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check .

  test:
    name: Test (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r api/requirements-dev.txt
      - run: pytest --cov=api --cov-report=term-missing --cov-fail-under=60

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t itis-web:ci .
      - run: docker run -d --name itis -p 8000:8000 itis-web:ci
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          echo "Сервис не поднялся"; docker logs itis; exit 1
      - name: Logs on failure
        if: failure()
        run: docker logs itis || true
      - name: Cleanup
        if: always()
        run: docker rm -f itis || true
